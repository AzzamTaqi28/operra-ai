services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-operra}
      POSTGRES_USER: ${POSTGRES_USER:-operra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-operra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-operra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-operra-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://operra:operra@postgres:5432/operra?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-please}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-operra}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-operra}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-operra-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      - postgres
      - minio
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:8080}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
